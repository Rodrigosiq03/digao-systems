name: cloud-gaming

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "clients/web/cloud-gaming/**"
      - "services/go/cloud-gaming/**"
      - "services/cpp/cloud-gaming-motor/**"
      - "deploy/cloud-gaming/**"
      - ".github/workflows/cloud-gaming.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deploy step? (true|false)"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      stack:
        description: "Deploy stack (dev|homolog|prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - homolog
          - prod

concurrency:
  group: cloud-gaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, infra-light]
    outputs:
      cloud_gaming: ${{ steps.filter.outputs.cloud_gaming }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud_gaming:
              - "clients/web/cloud-gaming/**"
              - "services/go/cloud-gaming/**"
              - "services/cpp/cloud-gaming-motor/**"
              - "deploy/cloud-gaming/**"
              - ".github/workflows/cloud-gaming.yml"

  ci:
    runs-on: [self-hosted, infra-heavy]
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.cloud_gaming == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go tests
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e GOCACHE=/tmp/go-build \
            -e GOPATH=/tmp/go \
            -v "$PWD":/workspace \
            -w /workspace/services/go/cloud-gaming \
            golang:1.22 \
            sh -lc 'export PATH=$PATH:/usr/local/go/bin && go test ./...'

      - name: C++ build and tests
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            debian:bookworm \
            bash -lc 'set -euo pipefail \
              && apt-get update \
              && apt-get install -y --no-install-recommends cmake g++ ninja-build \
              && project_dir="$(mktemp -d /tmp/cloud-gaming-motor-XXXXXX)" \
              && tar -C /workspace/services/cpp/cloud-gaming-motor --exclude=build -cf - . | tar -C "$project_dir" -xf - \
              && cmake -S "$project_dir" -B "$project_dir/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              && cmake --build "$project_dir/build" \
              && ctest --test-dir "$project_dir/build" --output-on-failure'

      - name: Build backend image
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e GOCACHE=/tmp/go-build \
            -e GOPATH=/tmp/go \
            -v "$PWD":/workspace \
            -w /workspace/services/go/cloud-gaming \
            golang:1.22 \
            sh -lc 'export PATH=$PATH:/usr/local/go/bin && mkdir -p bin && go build -o ./bin/cloud-gaming ./cmd/server'

      - name: Build web image
        run: docker build -t digao-cloud-gaming-web:${{ github.sha }} clients/web/cloud-gaming

      - name: Build motor image
        if: ${{ hashFiles('services/cpp/cloud-gaming-motor/**') != '' }}
        run: docker build -t digao-cloud-gaming-motor:${{ github.sha }} services/cpp/cloud-gaming-motor

  deploy:
    runs-on: [self-hosted, infra-heavy]
    needs: [changes, ci]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true') ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.cloud_gaming == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide stack
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate production
        if: ${{ steps.stack.outputs.value == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production deploy for cloud-gaming"
          issue-body: "Approve to deploy cloud-gaming to prod."

      - name: Deploy cloud-gaming dev v1 hub
        run: |
          set -euo pipefail
          STACK="${{ steps.stack.outputs.value }}"
          case "$STACK" in
            dev)
              CLOUD_HOST="https://cloud-dev.rodrigodsiqueira.dev.br:8443"
              KC_PUBLIC_BASE="https://kc-dev.rodrigodsiqueira.dev.br:8443"
              ;;
            homolog)
              CLOUD_HOST="https://cloud-homolog.rodrigodsiqueira.dev.br:8443"
              KC_PUBLIC_BASE="https://kc-homolog.rodrigodsiqueira.dev.br:8443"
              ;;
            prod)
              CLOUD_HOST="https://cloud.rodrigodsiqueira.dev.br"
              KC_PUBLIC_BASE="https://login.rodrigodsiqueira.dev.br"
              ;;
          esac
          SECRETS_FILE="${{ secrets.SECRETS_FILE_PATH }}"
          if [[ -z "$SECRETS_FILE" ]]; then
            SECRETS_FILE="/data/apps/pulumi/.secrets.local"
          fi
          cd deploy/cloud-gaming
          python3 ./host/prepare_proxy_auth.py \
            --secrets-file "$SECRETS_FILE" \
            --env "$STACK" \
            --cloud-host "$CLOUD_HOST" \
            --keycloak-admin-base-url "$KC_PUBLIC_BASE" \
            --keycloak-public-base-url "$KC_PUBLIC_BASE" \
            --output ./host/oauth2-proxy.env
          cat > ./host/cloud-gaming.host.env <<EOF
          PORT=8090
          STREAM_PROVIDER=sunshine
          FRAME_RATE=60
          AUTH_MODE=proxy
          AUTH_PROXY_USER_HEADER=X-Forwarded-User
          AUTH_PROXY_EMAIL_HEADER=X-Forwarded-Email
          MAX_CONCURRENT_SESSIONS=1
          LAUNCH_MODE=exec
          SESSION_SHELL=/bin/bash
          SESSION_AUTO_END_ON_PROCESS_EXIT=false
          GAME_LAUNCH_PREFIX="/data/apps/deploy/cloud-gaming/host/launch-game.sh --command {command} --game-id {game_id}"
          GAME_CATALOG_FILE=/data/apps/deploy/cloud-gaming/host/catalog.dev-v1.json
          EOF
          mkdir -p ~/.config/systemd/user
          install -m 644 ./host/cloud-gaming-backend.service ~/.config/systemd/user/cloud-gaming-backend.service
          systemctl --user daemon-reload
          systemctl --user enable --now cloud-gaming-backend.service
          systemctl --user restart cloud-gaming-backend.service
          docker compose down || true
          docker compose up -d --build digao-cloud-gaming-web oauth2-proxy-cloud-gaming
          docker image prune -f
