name: pulumi-digao-oauth-portal

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "clients/web/digao-oauth-portal/**"
      - "pulumi/digao-oauth-portal/**"
      - ".github/workflows/pulumi-digao-oauth-portal.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack select (dev|homolog|prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - homolog
          - prod

concurrency:
  group: pulumi-digao-oauth-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, infra-light]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.stack || (github.ref == 'refs/heads/main' && 'homolog' || 'dev') }}
    defaults:
      run:
        working-directory: pulumi/digao-oauth-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide stack
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate production
        if: ${{ steps.stack.outputs.value == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production deploy for digao-oauth-portal"
          issue-body: "Approve to deploy digao-oauth-portal to prod."

      - name: Render stack config
        env:
          STACK: ${{ steps.stack.outputs.value }}
          DIGAO_OAUTH_PORTAL_VITE_KC_URL: ${{ secrets.DIGAO_OAUTH_PORTAL_VITE_KC_URL }}
          DIGAO_OAUTH_PORTAL_VITE_API_URL: ${{ secrets.DIGAO_OAUTH_PORTAL_VITE_API_URL }}
        run: |
          if [[ -z "$DIGAO_OAUTH_PORTAL_VITE_KC_URL" || -z "$DIGAO_OAUTH_PORTAL_VITE_API_URL" ]]; then
            echo "Missing stack config secrets for $STACK"
            exit 1
          fi

          cat > "Pulumi.${STACK}.yaml" <<EOF
          config:
            digao-oauth-portal:viteKcUrl: "$DIGAO_OAUTH_PORTAL_VITE_KC_URL"
            digao-oauth-portal:viteApiUrl: "$DIGAO_OAUTH_PORTAL_VITE_API_URL"
          EOF

      - name: Prepare venv
        run: |
          PY="$HOME/.pyenv/versions/3.12.8/bin/python"
          VENV="/data/apps/.venvs/pulumi-portal"
          if [[ ! -x "$PY" ]]; then
            echo "pyenv Python 3.12.8 not found at $PY"
            exit 1
          fi
          "$PY" --version
          if [[ ! -x "$VENV/bin/python" ]]; then
            "$PY" -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip
          else
            "$VENV/bin/python" --version
          fi

      - name: Install dependencies
        run: |
          VENV="/data/apps/.venvs/pulumi-portal"
          REQ_HASH_FILE="$VENV/.requirements.sha256"
          CURRENT_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          if [[ -f "$REQ_HASH_FILE" ]] && [[ "$(cat "$REQ_HASH_FILE")" == "$CURRENT_HASH" ]]; then
            echo "requirements.txt unchanged; skipping pip install"
          else
            "$VENV/bin/python" -m pip install -r requirements.txt
            printf '%s\n' "$CURRENT_HASH" > "$REQ_HASH_FILE"
          fi

      - name: Show requirements
        run: cat requirements.txt

      - name: Pulumi login
        run: pulumi login "${{ secrets.PULUMI_BACKEND_URL }}"

      - name: Select or init stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-portal/bin/python
        run: |
          STACK="${{ steps.stack.outputs.value }}"
          if pulumi stack select "$STACK" >/dev/null 2>&1; then
            pulumi stack select "$STACK"
          else
            pulumi stack init "$STACK"
          fi

      - name: Deploy
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-portal/bin/python
        run: pulumi up --yes
