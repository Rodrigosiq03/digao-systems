name: pulumi-prometheus

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "pulumi/prometheus/**"
      - ".github/workflows/pulumi-prometheus.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack select (dev|homolog|prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - homolog
          - prod

concurrency:
  group: pulumi-prometheus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, infra-light]
    defaults:
      run:
        working-directory: pulumi/prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide stack
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate production
        if: ${{ steps.stack.outputs.value == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production deploy for prometheus"
          issue-body: "Approve to deploy prometheus to prod."

      - name: Prepare venv
        run: |
          PY="$HOME/.pyenv/versions/3.12.8/bin/python"
          VENV="/data/apps/.venvs/pulumi-prometheus"
          if [[ ! -x "$PY" ]]; then
            echo "pyenv Python 3.12.8 not found at $PY"
            exit 1
          fi
          "$PY" --version
          if [[ ! -x "$VENV/bin/python" ]]; then
            "$PY" -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip
          else
            "$VENV/bin/python" --version
          fi

      - name: Install dependencies
        run: |
          VENV="/data/apps/.venvs/pulumi-prometheus"
          REQ_HASH_FILE="$VENV/.requirements.sha256"
          CURRENT_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          START_TS="$(date +%s)"
          if [[ -f "$REQ_HASH_FILE" ]] && [[ "$(cat "$REQ_HASH_FILE")" == "$CURRENT_HASH" ]]; then
            echo "requirements.txt unchanged; skipping pip install"
          else
            "$VENV/bin/python" -m pip install -r requirements.txt
            printf '%s\n' "$CURRENT_HASH" > "$REQ_HASH_FILE"
          fi
          END_TS="$(date +%s)"
          echo "dependency_bootstrap_seconds=$((END_TS - START_TS))"

      - name: Pulumi login
        run: pulumi login "${{ secrets.PULUMI_BACKEND_URL }}"

      - name: Select or init stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-prometheus/bin/python
        run: |
          STACK="${{ steps.stack.outputs.value }}"
          if pulumi stack select "$STACK" >/dev/null 2>&1; then
            pulumi stack select "$STACK"
          else
            pulumi stack init "$STACK"
          fi

      - name: Deploy
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-prometheus/bin/python
        run: |
          START_TS="$(date +%s)"
          pulumi up --yes
          END_TS="$(date +%s)"
          echo "pulumi_up_seconds=$((END_TS - START_TS))"
