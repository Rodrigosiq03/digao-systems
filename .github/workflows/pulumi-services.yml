name: pulumi-services

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "services/java/auth-service/**"
      - "services/java/notification-service/**"
      - "pulumi/auth-service/**"
      - "pulumi/notification-service/**"
      - ".github/workflows/pulumi-services.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (notification|auth|all)"
        required: true
        type: choice
        default: notification
        options:
          - notification
          - auth
          - all
      stack:
        description: "Pulumi stack (dev|homolog|prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - homolog
          - prod

concurrency:
  group: pulumi-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, infra-light]
    outputs:
      notification: ${{ steps.filter.outputs.notification }}
      auth: ${{ steps.filter.outputs.auth }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            notification:
              - "services/java/notification-service/**"
              - "pulumi/notification-service/**"
            auth:
              - "services/java/auth-service/**"
              - "pulumi/auth-service/**"

  deploy:
    runs-on: [self-hosted, infra-heavy]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.stack || (github.ref == 'refs/heads/main' && 'homolog' || 'dev') }}
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.ref == 'refs/heads/develop' && (needs.changes.outputs.notification == 'true' || needs.changes.outputs.auth == 'true')) ||
      (github.ref == 'refs/heads/main' && (needs.changes.outputs.notification == 'true' || needs.changes.outputs.auth == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: notification
            project: notification-service
            dir: services/java/notification-service
          - service: auth
            project: auth-service
            dir: services/java/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide stack
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate production
        if: ${{ steps.stack.outputs.value == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production deploy for ${{ matrix.service }}"
          issue-body: "Approve to deploy ${{ matrix.service }} to prod."

      - name: Skip non-target service
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.service != 'all' && inputs.service != matrix.service) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification != 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth != 'true')))
        run: echo "Skipping ${{ matrix.service }}."

      - name: Build jar
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        env:
          MAVEN_USER_HOME: /data/apps/.m2
          MAVEN_OPTS: -Dmaven.repo.local=/data/apps/.m2/repository
        run: |
          set -euo pipefail
          mkdir -p /data/apps/.m2
          START_TS="$(date +%s)"
          echo "Building ${{ matrix.dir }} from its module pom"
          ./${{ matrix.dir }}/mvnw \
            -f "${{ matrix.dir }}/pom.xml" \
            -ntp \
            -Dmaven.test.skip=true \
            package

          JAR="$(ls ${{ matrix.dir }}/target/*.jar | rg -v '(plain|sources|javadoc|original)' | head -n 1 || true)"
          if [[ -z "$JAR" ]]; then
            JAR="$(ls ${{ matrix.dir }}/target/*.jar | head -n 1)"
          fi
          if [[ -z "$JAR" ]]; then
            echo "No jar found for ${{ matrix.dir }}"
            exit 1
          fi
          cp "$JAR" "${{ matrix.dir }}/target/app.jar"
          CONTEXT_DIR="${{ matrix.dir }}/target/pulumi-image-context"
          rm -rf "$CONTEXT_DIR"
          mkdir -p "$CONTEXT_DIR"
          cp "${{ matrix.dir }}/Dockerfile" "$CONTEXT_DIR/Dockerfile"
          cp "${{ matrix.dir }}/target/app.jar" "$CONTEXT_DIR/app.jar"
          END_TS="$(date +%s)"
          echo "maven_package_seconds=$((END_TS - START_TS))"

      - name: Prepare venv
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        run: |
          PY="$HOME/.pyenv/versions/3.12.8/bin/python"
          VENV="/data/apps/.venvs/pulumi-services-${{ matrix.project }}"
          if [[ ! -x "$PY" ]]; then
            echo "pyenv Python 3.12.8 not found at $PY"
            exit 1
          fi
          "$PY" --version
          if [[ ! -x "$VENV/bin/python" ]]; then
            "$PY" -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip
          else
            "$VENV/bin/python" --version
          fi

      - name: Install dependencies
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        run: |
          VENV="/data/apps/.venvs/pulumi-services-${{ matrix.project }}"
          REQ_FILE="pulumi/${{ matrix.project }}/requirements.txt"
          REQ_HASH_FILE="$VENV/.requirements.sha256"
          CURRENT_HASH="$(sha256sum "$REQ_FILE" | awk '{print $1}')"
          START_TS="$(date +%s)"
          if [[ -f "$REQ_HASH_FILE" ]] && [[ "$(cat "$REQ_HASH_FILE")" == "$CURRENT_HASH" ]]; then
            echo "requirements.txt unchanged; skipping pip install"
          else
            "$VENV/bin/python" -m pip install -r "$REQ_FILE"
            printf '%s\n' "$CURRENT_HASH" > "$REQ_HASH_FILE"
          fi
          END_TS="$(date +%s)"
          echo "dependency_bootstrap_seconds=$((END_TS - START_TS))"

      - name: Pulumi login
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        run: pulumi login "${{ secrets.PULUMI_BACKEND_URL }}"

      - name: Apply secrets
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          SECRETS_FILE="${{ secrets.SECRETS_FILE_PATH }}"
          if [[ -z "$SECRETS_FILE" ]]; then
            SECRETS_FILE="/data/apps/pulumi/.secrets.local"
          fi
          /data/apps/.venvs/pulumi-services-${{ matrix.project }}/bin/python \
            pulumi/scripts/apply-secrets.py \
            --project "${{ matrix.project }}" \
            --stack "${{ steps.stack.outputs.value }}" \
            --env "${{ steps.stack.outputs.value }}" \
            --secrets-file "$SECRETS_FILE" \
            --create

      - name: Set auth portal origins
        if: |
          matrix.service == 'auth' &&
          ((github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
           (github.event_name != 'workflow_dispatch' && needs.changes.outputs.auth == 'true'))
        env:
          STACK: ${{ steps.stack.outputs.value }}
          AUTH_SERVICE_PORTAL_ORIGINS: ${{ vars.AUTH_SERVICE_PORTAL_ORIGINS }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-services-${{ matrix.project }}/bin/python
        run: |
          if [[ -z "$AUTH_SERVICE_PORTAL_ORIGINS" ]]; then
            echo "Missing AUTH_SERVICE_PORTAL_ORIGINS for $STACK"
            exit 1
          fi

          pulumi -C pulumi/auth-service config set auth-service:portalOrigins "$AUTH_SERVICE_PORTAL_ORIGINS"

      - name: Select stack
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-services-${{ matrix.project }}/bin/python
        run: pulumi -C pulumi/${{ matrix.project }} stack select "${{ steps.stack.outputs.value }}"

      - name: Deploy
        if: |
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.service)) ||
          (github.event_name != 'workflow_dispatch' &&
           ((matrix.service == 'notification' && needs.changes.outputs.notification == 'true') ||
            (matrix.service == 'auth' && needs.changes.outputs.auth == 'true')))
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-services-${{ matrix.project }}/bin/python
        run: |
          START_TS="$(date +%s)"
          pulumi -C pulumi/${{ matrix.project }} up --yes
          END_TS="$(date +%s)"
          echo "pulumi_up_seconds=$((END_TS - START_TS))"
