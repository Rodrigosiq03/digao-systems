name: pulumi-redis

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "pulumi/redis/**"
      - "pulumi/scripts/apply-secrets.py"
      - ".github/workflows/pulumi-redis.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack select (dev|homolog|prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - homolog
          - prod

concurrency:
  group: pulumi-redis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, infra-light]
    defaults:
      run:
        working-directory: pulumi/redis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide stack
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "value=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate production
        if: ${{ steps.stack.outputs.value == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production deploy for redis"
          issue-body: "Approve to deploy redis to prod."

      - name: Prepare venv
        run: |
          PY="$HOME/.pyenv/versions/3.12.8/bin/python"
          VENV="/data/apps/.venvs/pulumi-redis"
          if [[ ! -x "$PY" ]]; then
            echo "pyenv Python 3.12.8 not found at $PY"
            exit 1
          fi
          "$PY" --version
          if [[ ! -x "$VENV/bin/python" ]]; then
            "$PY" -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip
          else
            "$VENV/bin/python" --version
          fi

      - name: Install dependencies
        run: |
          VENV="/data/apps/.venvs/pulumi-redis"
          REQ_HASH_FILE="$VENV/.requirements.sha256"
          CURRENT_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          if [[ -f "$REQ_HASH_FILE" ]] && [[ "$(cat "$REQ_HASH_FILE")" == "$CURRENT_HASH" ]]; then
            echo "requirements.txt unchanged; skipping pip install"
          else
            "$VENV/bin/python" -m pip install -r requirements.txt
            printf '%s\n' "$CURRENT_HASH" > "$REQ_HASH_FILE"
          fi

      - name: Show requirements
        run: cat requirements.txt

      - name: Pulumi login
        run: pulumi login "${{ secrets.PULUMI_BACKEND_URL }}"

      - name: Apply secrets
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          SECRETS_FILE="${{ secrets.SECRETS_FILE_PATH }}"
          if [[ -z "$SECRETS_FILE" ]]; then
            SECRETS_FILE="/data/apps/pulumi/.secrets.local"
          fi
          /data/apps/.venvs/pulumi-redis/bin/python \
            ../scripts/apply-secrets.py \
            --project redis \
            --stack "${{ steps.stack.outputs.value }}" \
            --env "${{ steps.stack.outputs.value }}" \
            --secrets-file "$SECRETS_FILE" \
            --create

      - name: Select stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-redis/bin/python
        run: pulumi stack select "${{ steps.stack.outputs.value }}"

      - name: Deploy
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_PYTHON_CMD: /data/apps/.venvs/pulumi-redis/bin/python
        run: pulumi up --yes
