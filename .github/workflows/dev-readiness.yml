name: dev-readiness

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

concurrency:
  group: dev-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-dev:
    runs-on: [self-hosted, infra-light]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dev stack smoke test
        run: bash deploy/network/scripts/check-dev-stack.sh
