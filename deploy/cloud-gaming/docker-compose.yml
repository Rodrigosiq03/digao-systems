services:
  digao-cloud-gaming-backend:
    build:
      context: ../../services/go/cloud-gaming
    container_name: digao-cloud-gaming-backend
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=8090
      - FRAME_RATE=60
      - STREAM_PROVIDER=sunshine
      - MAX_CONCURRENT_SESSIONS=1
      - LAUNCH_MODE=noop
      - SESSION_SHELL=/bin/bash
      - AUTH_MODE=none
      - AUTH_DEFAULT_USER=dev-rodrigo
      - GAME_CATALOG_FILE=/app/config/catalog.dev-v1.json
    volumes:
      - ./host/catalog.dev-v1.json:/app/config/catalog.dev-v1.json:ro
